name: Setup do workspace
description: Prepara Node, pnpm, cache de dependências e cache do Turborepo para o monorepo GK-Barber.

inputs:
  node-version:
    description: Versão do Node.js a instalar.
    required: false
    default: "22"
  install:
    description: Se "true", executa `pnpm install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # A versão do pnpm vem do campo `packageManager` do package.json da raiz —
    # uma fonte de verdade só, igual à do ambiente local dos devs.
    - name: Instalar pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Instalar Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Instalar dependências
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Cache local do Turborepo: sem remote cache, é o que evita reexecutar
    # build/test de pacotes que não mudaram entre um run e outro.
    - name: Cache do Turborepo
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-
