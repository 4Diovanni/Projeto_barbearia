version: 2

# As actions são fixadas por SHA de commit (defesa contra tag movida). Sem
# atualização automatizada, isso congela as versões e vira dívida de segurança
# — o Dependabot é a outra metade dessa decisão.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ⚠️ O bloco npm abaixo fica comentado até `package.json` existir na raiz.
  #
  # Diferente dos jobs do CI, o Dependabot não se autodesliga: sem manifesto
  # ele aborta com "/package.json not found", falha toda semana e notifica o
  # repositório. Descomente junto com o commit que criar o monorepo pnpm.
  #
