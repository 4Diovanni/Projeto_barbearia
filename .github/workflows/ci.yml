name: CI

# Qualidade da stack TypeScript do monorepo (Turborepo + pnpm):
# lint, tipos, testes unitários, build web/mobile e E2E da agenda pública.
#
# Enquanto o monorepo não existe, o job `detect` desliga os demais — o CI passa
# verde sem mentir que testou algo. Cada job liga sozinho quando o arquivo
# correspondente aparece no repositório.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Descobre o que já existe no repositório e liga os jobs correspondentes.
  # ══════════════════════════════════════════════════════════════════════════
  detect:
    name: Detectar stack
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      web: ${{ steps.check.outputs.web }}
      mobile: ${{ steps.check.outputs.mobile }}
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verificar artefatos da stack
        id: check
        run: |
          set -euo pipefail
          existe() { if compgen -G "$1" > /dev/null; then echo true; else echo false; fi; }
          {
            echo "node=$(existe 'package.json')"
            echo "web=$(existe 'apps/web/package.json')"
            echo "mobile=$(existe 'apps/mobile/package.json')"
            echo "e2e=$(existe 'apps/web/playwright.config.*')"
          } | tee -a "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════════════════════════════════════
  # Lint do repositório: YAML, Markdown, JSON e os próprios workflows
  # (actionlint). Roda sempre — não depende do código da aplicação existir.
  # TypeScript fica de fora aqui de propósito: quem valida TS é o ESLint do
  # monorepo, no job `quality`, com as regras do projeto.
  # ══════════════════════════════════════════════════════════════════════════
  repo-lint:
    name: Lint do repositório
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          # Escopo restrito: o resto do lint pertence ao toolchain do monorepo.
          VALIDATE_YAML: "true"
          VALIDATE_JSON: "true"
          VALIDATE_MARKDOWN: "true"
          VALIDATE_GITHUB_ACTIONS: "true"
          VALIDATE_BASH: "true"
          FILTER_REGEX_EXCLUDE: '(.github/(ISSUE_TEMPLATE|pull_request_template.md)/.*|pnpm-lock.yaml|.*/node_modules/.*|supabase/.branches/.*)'

  # ══════════════════════════════════════════════════════════════════════════
  # ESLint + Prettier + tsc. O typecheck é o que dá valor real aos tipos
  # gerados do Postgres: coluna renomeada no banco quebra aqui, não em produção.
  # ══════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint e tipos
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ESLint
        run: pnpm turbo run lint

      - name: Formatação (Prettier)
        run: pnpm turbo run format:check

      - name: Typecheck (tsc --noEmit)
        run: pnpm turbo run typecheck

  # ══════════════════════════════════════════════════════════════════════════
  # Vitest. `packages/core` (agenda, preços, comissão, PIX) é domínio puro:
  # roda em milissegundos e é onde a cobertura precisa ser alta.
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Testes unitários
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Vitest com cobertura
        run: pnpm turbo run test -- --coverage

      # Fuso horário é a causa nº 1 de bug de agenda (§6.2 da arquitetura).
      # Reexecutar a suíte em UTC pega toda lógica que assume o fuso do runner.
      - name: Vitest em UTC (guarda de fuso horário)
        env:
          TZ: UTC
        run: pnpm turbo run test --force

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: |
            **/coverage/**
          retention-days: 7
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # Build do painel + agenda pública (Next.js 15).
  # ══════════════════════════════════════════════════════════════════════════
  build-web:
    name: Build web (Next.js)
    needs: [detect, quality]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Valores de placeholder: o build não deve depender de projeto real.
      # A service_role key nunca entra aqui — nem em variável NEXT_PUBLIC_.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm turbo run build --filter=./apps/web...

  # ══════════════════════════════════════════════════════════════════════════
  # App do barbeiro (Expo). Sem build EAS no CI de PR — só a checagem de
  # consistência do projeto, que é o que quebra sem avisar.
  # ══════════════════════════════════════════════════════════════════════════
  check-mobile:
    name: Checagem mobile (Expo)
    needs: [detect, quality]
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Expo Doctor
        run: pnpm --filter ./apps/mobile exec expo-doctor

  # ══════════════════════════════════════════════════════════════════════════
  # E2E do fluxo público de agendamento, contra um Supabase local de verdade —
  # com as migrations e o seed aplicados. É o fluxo que gera receita; testar
  # contra mock aqui não prova nada.
  # ══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E da agenda pública (Playwright)
    needs: [detect, quality]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Subir Supabase local
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Aplicar migrations e seed
        run: supabase db reset

      - name: Exportar chaves locais para o app
        run: |
          set -euo pipefail
          # Chaves do stack local: efêmeras, públicas e descartadas ao fim do
          # job. A service_role key não é exportada — o app nunca precisa dela.
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Instalar navegadores do Playwright
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium

      - name: Executar Playwright
        run: pnpm --filter ./apps/web exec playwright test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════
  # Gate único para a branch protection: exige só este check no main.
  # Jobs pulados são aceitos; jobs que falharam ou foram cancelados, não.
  # ══════════════════════════════════════════════════════════════════════════
  ci-ok:
    name: CI OK
    if: always()
    needs: [repo-lint, quality, test, build-web, check-mobile, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar resultado
        run: |
          set -euo pipefail
          resultados='${{ join(needs.*.result, ' ') }}'
          echo "Resultados dos jobs: $resultados"
          for r in $resultados; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Pipeline reprovada — ao menos um job falhou."
              exit 1
            fi
          done
          echo "Pipeline aprovada."
